name: Tutorial image

on:
  pull_request:
    paths:
      - ".binder/**"
      - ".github/workflows/tutorial-image.yml"
      - "tutorials/**"
      - "examples/interactive/**"
      - "examples/gammapy/data/**"
      - "python/**"
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "pyproject.toml"
  push:
    tags:
      - "tutorial-v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/modbhjet-tutorial
  TEST_IMAGE_TAG: ci-${{ github.sha }}

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out modBHJet
        uses: actions/checkout@v4

      - name: Install repo2docker
        run: python -m pip install jupyter-repo2docker

      - name: Build the Binder image
        run: |
          jupyter-repo2docker --no-run \
            --image-name "${IMAGE_NAME}:${TEST_IMAGE_TAG}" \
            .

      - name: Run the post-build smoke test
        run: |
          docker run --rm \
            --entrypoint python \
            -e OMP_NUM_THREADS=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -e NUMEXPR_NUM_THREADS=1 \
            "${IMAGE_NAME}:${TEST_IMAGE_TAG}" \
            tutorials/smoke_test.py

      - name: Execute the public tutorial notebooks
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e OMP_NUM_THREADS=1 \
            -e OPENBLAS_NUM_THREADS=1 \
            -e MKL_NUM_THREADS=1 \
            -e NUMEXPR_NUM_THREADS=1 \
            "${IMAGE_NAME}:${TEST_IMAGE_TAG}" \
            -lc 'jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=300 \
              --output-dir=/tmp/bhjet-tutorial-executed \
              tutorials/welcome.ipynb \
              tutorials/1_pilot_explorer.ipynb \
              tutorials/2_source_SED_analysis.ipynb \
              tutorials/3_student_workbook.ipynb'

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested release image
        if: github.ref_type == 'tag'
        id: publish
        run: |
          RELEASE_IMAGE="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker tag "${IMAGE_NAME}:${TEST_IMAGE_TAG}" "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$RELEASE_IMAGE")"
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "## Published tutorial image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
