name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modBHJet
        uses: actions/checkout@v4
        with:
          path: modBHJet

      - name: Checkout Kariba
        uses: actions/checkout@v4
        with:
          repository: rubyduncan/kariba
          path: kariba

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install docs dependencies
        run: python -m pip install -r modBHJet/docs/requirements.txt

      - name: Generate C++ XML
        working-directory: modBHJet/docs
        run: doxygen Doxyfile

      - name: Build Sphinx docs
        working-directory: modBHJet
        run: sphinx-build -b html docs docs/_build/html
